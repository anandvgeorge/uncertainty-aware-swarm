name: CI

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Configuration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install YAML parser
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Validate configuration
        run: python3 scripts/ci-check-config.py

  build:
    name: Build and simulation smoke test
    needs: config
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SWARM_CI_IMAGE_PREFIX: swarm-ci
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build builder image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.builder
          tags: swarm-ci-builder:latest
          load: true
          push: false
          cache-from: type=gha,scope=builder
          cache-to: type=gha,scope=builder,mode=max

      - name: Build autonomy image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.autonomy
          tags: swarm-ci-autonomy:latest
          load: true
          push: false
          cache-from: type=gha,scope=autonomy
          cache-to: type=gha,scope=autonomy,mode=max

      - name: Build Gazebo image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.gazebo
          tags: swarm-ci-gazebo:latest
          load: true
          push: false
          cache-from: type=gha,scope=gazebo
          cache-to: type=gha,scope=gazebo,mode=max

      - name: Build and verify installed workspace
        run: bash scripts/ci-build.sh "$RUNNER_TEMP/ci-build-logs"

      - name: Run headless three-robot smoke test
        timeout-minutes: 10
        run: bash scripts/ci-smoke.sh "$RUNNER_TEMP/ci-smoke-logs"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          path: ${{ runner.temp }}/ci-build-logs
          if-no-files-found: warn
          retention-days: 7

      - name: Upload simulation logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-test-logs
          path: ${{ runner.temp }}/ci-smoke-logs
          if-no-files-found: warn
          retention-days: 7
