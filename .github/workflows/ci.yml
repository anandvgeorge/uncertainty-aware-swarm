name: CI

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Docker and ROS workspace build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build images and verify installed workspace
        run: bash scripts/ci-build.sh "$RUNNER_TEMP/ci-build-logs"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          path: ${{ runner.temp }}/ci-build-logs
          if-no-files-found: warn
          retention-days: 7
